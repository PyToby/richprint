name: Publish to TestPyPI

on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write   # required for trusted publishing, no token/secret needed

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tool
        run: python -m pip install build

      - name: Give this run a unique dev version
        run: |
          sed -i -E "s/^version = \"([0-9]+\.[0-9]+\.[0-9]+)\"/version = \"\1.dev${{ github.run_number }}\"/" pyproject.toml
          grep '^version' pyproject.toml

      - name: Build package
        run: python -m build

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
